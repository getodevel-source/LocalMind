[package]
name = "localmind"
version = "2.0.0"
edition = "2021"

[dependencies]
tao = "0.30"
wry = "0.45"
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
ureq = { version = "2.10", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
